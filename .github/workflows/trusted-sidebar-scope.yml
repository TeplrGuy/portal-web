name: Trusted sidebar scope

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: trusted-sidebar-scope-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  trusted-sidebar-scope:
    if: github.repository == 'TeplrGuy/portal-web' && github.event.pull_request.user.login == 'copilot-swe-agent[bot]' && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # Use only the trusted base revision; never execute pull-request code here.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate candidate files against the base policy
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          test "$BASE_BRANCH" = main
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          test -f .github/delivery/sidebar.json
          test -f scripts/sidebar-policy.cjs
          changed_files=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq .changed_files)
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" --jq '.[] | @json' > "$RUNNER_TEMP/sidebar-files.jsonl"
          node -e "const fs=require('node:fs');const lines=fs.readFileSync(process.argv[1],'utf8').trim();const files=lines?lines.split('\n').map(line=>JSON.parse(line)):[];if(files.length!==Number(process.argv[2]))throw new Error('Incomplete PR file listing');require('./scripts/sidebar-policy.cjs').validateFiles(require('./.github/delivery/sidebar.json'),files);" "$RUNNER_TEMP/sidebar-files.jsonl" "$changed_files"
