name: Sidebar policy

on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: sidebar-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  policy-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/delivery/*.test.cjs
